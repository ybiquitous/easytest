name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  ruby-version:
    runs-on: ubuntu-latest
    outputs:
      minimum: ${{ steps.required_ruby_version.outputs.minimum }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: required_ruby_version
        run: |
          version=$(ruby -e 'puts Gem::Specification.load("easytest.gemspec").required_ruby_version.requirements.first.last')
          echo "minimum=${version}" >> "${GITHUB_OUTPUT}"

  test:
    needs: ruby-version
    uses: ybiquitous/.github/.github/workflows/ruby-test-reusable.yml@1ed723b9d1b3a0073f2ae7a0be6c0ac1e4cf269b # v3.2.1
    with:
      minimum-ruby-version: ${{ fromJSON(needs.ruby-version.outputs.minimum) }}
    permissions:
      contents: read
